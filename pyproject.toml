[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localforge"
version = "1.1.2"
description = "Local, audited development workbench via MCP"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp==2.2.0", "defusedxml==0.7.1", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
localforge = "server.main:main"
project-mcp = "server.main:main"
localforge-ops = "localforge_ops.cli:main"

[project.gui-scripts]
localforge-tray = "localforge_ops.tray:main"

[tool.setuptools.packages.find]
include = ["server*", "adapters*", "capabilities*", "localforge_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
